# Quickshell owns its own geometry/concave animations. Keep Hyprland from
# adding compositor fade/slide on top of popup surfaces.
layerrule {
    name = quickshell_popup_no_compositor_animation
    animation = none
    match:namespace = ^quickshell:popup:
}

# Background wallpaper — startup animation handled natively by Hyprland
layerrule {
    name = background_slide
    animation = slide left
    match:namespace = ^quickshell:background$
}

