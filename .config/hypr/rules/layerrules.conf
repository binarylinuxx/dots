# blxshell animates its own panels. Keep Hyprland from adding a compositor
# fade/slide on top of the shell surface.
layerrule {
    name = blxshell_no_compositor_animation
    animation = none
    match:namespace = ^blxshell$
}

# Background wallpaper — startup animation handled natively by Hyprland
layerrule {
    name = background_slide
    animation = slide left
    match:namespace = ^blxshell-background$
}

