# Hyprland, set up for blxshell.
#
# Runix copies this to ~/.config/hypr/hyprland.conf once, for users who have
# no Hyprland configuration yet. It is yours from then on: edit it freely, and
# it is never overwritten. `blxshell help` lists the shell's commands.

# Every screen at its preferred mode; name one to place or scale it, as in
# monitor = DP-1, 2560x1440@144, 0x0, 1
monitor = , preferred, auto, 1

$terminal = ghostty
$mod = SUPER

# The shell: bar, launcher, notifications, wallpaper and lock screen.
exec-once = blxshell

env = XCURSOR_SIZE,24

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 12
}

# Applications and windows.
bind = $mod, Return, exec, $terminal
bind = $mod, Q, killactive,
bind = $mod, F, togglefloating,
bind = $mod, M, fullscreen,
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, Escape, exit,
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# blxshell.
bind = $mod, SPACE, exec, blxshell launcher
bind = $mod, D, exec, blxshell launcher
bind = $mod, L, exec, blxshell lock
bind = $mod, P, exec, blxshell powermenu
bind = $mod, W, exec, blxshell wallpapers
bind = $mod, S, exec, blxshell settings
bind = $mod, B, exec, blxshell sidebar

# Workspaces.
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# blxshell animates its own panels; a compositor fade on top would double it.
layerrule {
    name = blxshell_no_compositor_animation
    animation = none
    match:namespace = ^blxshell$
}

layerrule {
    name = blxshell_background
    animation = slide left
    match:namespace = ^blxshell-background$
}
